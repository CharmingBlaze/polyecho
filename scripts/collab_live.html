<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PolyEcho pairing board</title>
  <style>
    :root {
      --bg: #0c0e12;
      --panel: #151922;
      --line: #2a3140;
      --text: #e8edf2;
      --dim: #8b97a4;
      --cursor: #6cb6ff;
      --deepseek: #d4a657;
      --human: #e07a5f;
      --ok: #7dce9a;
      --warn: #e6c07b;
      --bad: #e06c75;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.45 ui-sans-serif, system-ui, Segoe UI, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 15px; margin: 0; font-weight: 650; }
    #link { color: var(--dim); }
    #link.ok { color: var(--ok); }
    #turn { color: var(--dim); }
    main { display: grid; grid-template-columns: 300px 280px minmax(0,1fr); min-height: calc(100vh - 48px); }
    section { padding: 14px 16px; border-right: 1px solid var(--line); min-width: 0; }
    section:last-child { border-right: 0; display: flex; flex-direction: column; }
    h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
    .agent { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel); }
    .agent.cursor { border-top: 3px solid var(--cursor); }
    .agent.deepseek { border-top: 3px solid var(--deepseek); margin-top: 10px; }
    .name { font-weight: 650; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #555; margin-right: 6px; }
    .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(125,206,154,.18); }
    .meta { color: var(--dim); margin-top: 4px; }
    .claim { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .claim b.cursor { color: var(--cursor); }
    .claim b.deepseek { color: var(--deepseek); }
    .feed { flex: 1; overflow: auto; display: flex; flex-direction: column-reverse; min-height: 180px; }
    .msg { background: var(--panel); border-radius: 8px; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .msg .who { color: var(--dim); font-size: 11px; }
    .kind-question { border-left: 3px solid var(--human); }
    .kind-done, .kind-ack { border-left: 3px solid var(--ok); }
    .kind-nack, .kind-claim { border-left: 3px solid var(--warn); }
    .kind-idle, .kind-release { border-left: 3px solid var(--dim); }
    .kind-progress { border-left: 3px solid var(--cursor); }
    .compose { margin-top: 14px; display: grid; gap: 6px; }
    select, input, textarea, button {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 8px; font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    button { cursor: pointer; background: #243044; }
    button:hover { border-color: var(--cursor); }
    #banner { display: none; background: #3a2a1a; color: var(--warn); padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; }
    .empty { color: var(--dim); }
    .hot { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dim); }
    .thread { color: var(--dim); font-size: 11px; margin-top: 4px; }
    .filters { display: flex; gap: 8px; margin-bottom: 8px; }
    .filters label { color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Pairing board</h1>
    <span id="link">connecting…</span>
    <span id="turn"></span>
  </header>
  <main>
    <section>
      <h2>Agents</h2>
      <div id="agents"></div>
      <form class="compose" id="form">
        <h2>Send</h2>
        <select id="from">
          <option value="human">human</option>
          <option value="cursor">cursor</option>
          <option value="deepseek">deepseek</option>
        </select>
        <select id="to">
          <option value="*">everyone</option>
          <option value="cursor">cursor</option>
          <option value="deepseek">deepseek</option>
          <option value="human">human</option>
        </select>
        <select id="kind">
          <option value="handoff">handoff</option>
          <option value="question">question</option>
          <option value="ack">ack</option>
          <option value="nack">nack</option>
          <option value="progress">progress</option>
          <option value="done">done</option>
          <option value="idle">idle</option>
          <option value="claim">claim</option>
          <option value="release">release</option>
        </select>
        <input id="topic" placeholder="topic (join, revisions…)" />
        <input id="files" placeholder="files (space-separated, for claim)" />
        <input id="reply" placeholder="reply to #id" />
        <textarea id="body" placeholder="short notice — Enter to send, Shift+Enter for newline"></textarea>
        <button type="submit">Post</button>
      </form>
      <div class="human">
        <h2>Human inbox</h2>
        <div id="human"></div>
      </div>
    </section>
    <section>
      <h2>File claims</h2>
      <div id="banner"></div>
      <div id="claims"></div>
      <h2 style="margin-top:18px">Hot files</h2>
      <div id="hot" class="hot"></div>
    </section>
    <section>
      <h2>Live feed</h2>
      <div class="filters">
        <label><input type="checkbox" id="mine" /> for me</label>
        <input id="filter" placeholder="filter topic or text" style="flex:1" />
      </div>
      <div class="feed" id="feed"></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const seenIds = new Set();
    function esc(s) {
      return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    }
    function paintState(s) {
      $('turn').textContent = 'HANDOFF turn: ' + (s.turn || '?') + '  ·  ' + (s.count || 0) + ' messages  ·  ' + (s.subscribers || 0) + ' listening';
      const p = (s.board && s.board.presence) || {};
      $('agents').innerHTML = ['cursor','deepseek'].map(id => {
        const row = p[id] || {};
        const age = row.age_s == null ? 'no heartbeat' : (row.live ? 'seen ' + row.age_s + 's ago' : 'away');
        return `<div class="agent ${id}">
          <div><span class="dot ${row.live ? 'live' : ''}"></span><span class="name">${id}</span></div>
          <div class="meta">${esc(row.status || 'offline')}${row.topic ? ' · ' + esc(row.topic) : ''}</div>
          <div class="meta">${age}</div>
        </div>`;
      }).join('');
      const claims = (s.board && s.board.claims) || {};
      const keys = Object.keys(claims);
      $('claims').innerHTML = keys.length
        ? keys.map(f => `<div class="claim"><b class="${esc(claims[f].agent)}">${esc(claims[f].agent)}</b> ${esc(f)}<div class="meta">${esc(claims[f].topic)} · ${esc(claims[f].since)}</div></div>`).join('')
        : '<div class="empty">no claims — exclusive write locks appear here</div>';
      const hot = (s.board && s.board.hot) || [];
      $('hot').innerHTML = hot.map(esc).join('<br>');
      const mcp = s.mcp || [];
      if (mcp.length) {
        $('hot').innerHTML += '<br><br>IDE: ' + mcp.map(c => esc(c.name || c.agent)).join(', ');
      }
    }
    function visible(m) {
      const q = ($('filter').value || '').toLowerCase();
      const mine = $('mine').checked;
      if (mine && m.to !== 'human' && m.to !== '*') return false;
      if (!q) return true;
      return [m.topic, m.body, m.from, m.kind, ...(m.files || [])].join(' ').toLowerCase().includes(q);
    }
    function row(m) {
      if (!m || m.kind === 'presence' || seenIds.has(m.id)) return;
      if (m.id) seenIds.add(m.id);
      const el = document.createElement('div');
      el.className = 'msg kind-' + (m.kind || '');
      el.dataset.id = m.id || '';
      const files = (m.files && m.files.length) ? '<div class="meta">' + m.files.map(esc).join(', ') + '</div>' : '';
      const thread = m.in_reply_to ? `<div class="thread">reply to #${esc(m.in_reply_to)}</div>` : '';
      el.innerHTML = `<div class="who">${esc(m.ts)}  ${esc(m.from)} -> ${esc(m.to)}  ${esc(m.kind)}${m.topic ? ' ['+esc(m.topic)+']' : ''}  #${esc(m.id)}</div>${esc(m.body || '')}${files}${thread}`;
      el.style.display = visible(m) ? '' : 'none';
      el.addEventListener('click', () => { $('reply').value = m.id || ''; });
      $('feed').prepend(el);
      if (m.to === 'human' || m.kind === 'question') {
        const q = document.createElement('div');
        q.className = 'msg kind-question';
        q.textContent = (m.from || '') + ': ' + (m.body || '');
        $('human').prepend(q);
      }
    }
    function applyFilter() {
      for (const el of $('feed').children) {
        const m = {
          id: el.dataset.id, kind: (el.className.match(/kind-(\S+)/) || [])[1],
          to: (el.querySelector('.who')?.textContent || ''),
          topic: el.textContent, body: el.textContent, from: el.textContent, files: []
        };
        el.style.display = visible({
          to: (el.querySelector('.who')?.textContent || '').includes(' -> human') ? 'human'
            : (el.querySelector('.who')?.textContent || '').includes(' -> *') ? '*' : '',
          topic: el.textContent, body: el.textContent, from: el.textContent, kind: m.kind, files: []
        }) ? '' : 'none';
      }
    }
    async function refresh() {
      const s = await fetch('/status').then(r => r.json());
      $('link').className = 'ok';
      $('link').textContent = 'live  ' + location.origin;
      paintState(s);
      return s;
    }
    $('form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const files = ($('files').value || '').trim().split(/\s+/).filter(Boolean);
      const payload = {
        from: $('from').value, to: $('to').value, kind: $('kind').value,
        topic: $('topic').value, body: $('body').value, files,
        in_reply_to: $('reply').value
      };
      const res = await fetch('/post', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        $('banner').style.display = 'block';
        $('banner').textContent = data.error || res.statusText;
        return;
      }
      $('banner').style.display = 'none';
      $('body').value = '';
      $('files').value = '';
      refresh();
    });
    $('body').addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('form').requestSubmit(); }
    });
    $('filter').addEventListener('input', applyFilter);
    $('mine').addEventListener('change', applyFilter);
    refresh().then(() => fetch('/log?n=80').then(r => r.json()).then(msgs => msgs.forEach(row))).catch(() => {
      $('link').textContent = 'offline';
    });
    const es = new EventSource('/stream?for=*');
    es.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.kind === 'presence' && m.board) {
        paintState({ turn: $('turn').textContent.replace(/^HANDOFF turn: ([^·]+).*/, '$1').trim(), board: m.board, count: undefined, subscribers: undefined });
        refresh();
        return;
      }
      row(m);
      refresh();
    };
    es.onerror = () => { $('link').className = ''; $('link').textContent = 'reconnecting…'; };
    es.onopen = () => { $('link').className = 'ok'; $('link').textContent = 'live  ' + location.origin; };
    setInterval(() => refresh().catch(() => {}), 4000);
  </script>
</body>
</html>
